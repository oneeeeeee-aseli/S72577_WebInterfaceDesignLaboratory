<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="ExerciseLM6_s72577CSS.css">
</head>
<body>
    <header>
        <h1>Welcome to the Cabaran Kebijaksaan Aseli</h1>
        <p>Sit Down and Have Fun!!!</p>
        <p>Wan Aimi Orizainal</p>
    </header>
    <main>
        <section id="quiz-section">
            <div id="timer">Time Left: <span id="time">30</span>s</div>
            <div id="question-container">
                <p id="question">Question will appear here</p>
                <div id="options" class="options">
                    <!-- Answer options will be dynamically added here -->
                </div>
            </div>
            <button id="submit-answer" class="button">Submit Answer</button>
        </section>
        <section id="feedback-section">
            <p id="feedback">Feedback will appear here</p>
        </section>
    </main>
    <footer>
        <p id="score">Score: 0</p>
        <p>Thank you for playing!</p>
    </footer>
    <script src="ExerciseLM6_s72577JS.js"></script>
</body>
</html>

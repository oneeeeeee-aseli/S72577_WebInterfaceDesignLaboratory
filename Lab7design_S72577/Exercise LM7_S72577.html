<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Design</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Hero Section with Transparent Text */
        .hero-section {
            position: relative;
            background: url('header.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center; /* Centers content vertically */
            justify-content: center; /* Centers content horizontally */
            flex-direction: column; /* Stacks the title and tagline vertically */
            color: white;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            margin: 0; /* Removes unnecessary margin */
        }

        .hero-section p {
            font-size: 1.5rem;
            margin: 10px 0 0; /* Adds space below the title */
        }

        /* Form Section */
        .form-section {
            background: rgba(0, 0, 0, 0.7) url('form-background.jpg') no-repeat center center/cover;
            padding: 40px;
            text-align: center;
            color: white;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .login-form input {
            padding: 10px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
        }

        .login-form button {
            padding: 10px;
            font-size: 1rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Side Navigation */
        .side-nav {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background: #333;
            color: white;
            width: 200px;
            padding: 10px;
        }

        .side-nav ul {
            list-style: none;
            padding: 0;
        }

        .side-nav ul li {
            margin: 10px 0;
        }

        .side-nav ul li a {
            color: white;
            text-decoration: none;
        }

        /* Slideshow Section */
        .slideshow-section {
            position: relative;
            height: 500px;
            background: #000;
        }

        .slides {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s;
        }

        /* Profile Card */
        .profile-section {
            background: url('profile-bg.jpg') no-repeat center center/cover;
            padding: 40px;
            text-align: center;
            color: white;
        }

        .profile-card {
            display: inline-block;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }

        .profile-card img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
        }

        .social-icons a {
            color: #ddd;
            text-decoration: none;
            margin: 0 10px;
            font-size: 1.2rem;
        }

        .social-icons a:hover {
            color: white;
        }

        /* Progress Bar */
        .progress-section {
            padding: 20px;
            text-align: center;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 20px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            background: #28a745;
            height: 100%;
            border-radius: 10px;
        }

        /* Collapsible Section */
        .collapsible-section {
            padding: 20px;
            text-align: center;
        }

        .collapsible {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .content {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Transparent Image Text -->
    <header class="hero-section">
        <h1 class="hero-title">Welcome to Dunia Wan Aimi Orizainal</h1>
        <p class="hero-tagline">Dream The Impossible, Make it Possible</p>
    </header>

    <!-- Form on Image -->
    <section class="form-section">
        <h2>Login</h2>
        <form class="login-form">
            <input type="text" placeholder="Username *Required" required>
            <input type="password" placeholder="Password *Required" required>
            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- Side Navigation -->
    <nav class="side-nav">
        <ul>
            <li><a href="https://www.chess.com/play/online">My Hobby</a></li>
            <li><a href="https://www.canva.com/design/DAFa07w0TQE/zLcfnbumoLHN7vG1nfHX6Q/edit?utm_content=DAFa07w0TQE&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton">Personal Project</a></li>
            <li><a href="https://www.umt.edu.my/">Profession</a></li>
        </ul>
    </nav>

    <!-- Transparent Image Slideshow -->
    <section class="slideshow-section">
        <div class="slideshow">
            <img class="slides" src="slide1.jpg" alt="Transparent Slide 1">
            <img class="slides" src="slide2.jpg" alt="Transparent Slide 2">
            <img class="slides" src="slide3.png" alt="Transparent Slide 3">
        </div>
    </section>

    <!-- Progress Bar -->
    <section class="progress-section">
        <h2>Project Completion</h2>
        <div class="progress-bar">
            <div class="progress" style="width: 80%;"></div>
        </div>
    </section>

    <!-- Collapsible Section -->
    <section class="collapsible-section">
        <button class="collapsible">FAQs</button>
        <div class="content">
            <p>WanAimiOrizainal@gmail.com</p>
        </div>
    </section>

    <!-- Profile Card -->
    <section class="profile-section">
        <div class="profile-card">
            <img src="profile.jpg" alt="Profile Picture">
            <h3>CEO Wan Aimi</h3>
            <p>Web Developer | Designer</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/">LinkedIn</a>
                <a href="https://github.com/">GitHub</a>
                <a href="https://x.com/?lang=en">Twitter</a>
            </div>
        </div>
    </section>

    <script>
        // Automatic Slideshow
        let slideIndex = 0;
        const slides = document.querySelectorAll('.slides');

        function showSlides() {
            slides.forEach((slide, index) => {
                slide.style.opacity = index === slideIndex ? '1' : '0';
            });
            slideIndex = (slideIndex + 1) % slides.length;
        }

        setInterval(showSlides, 3000); // Change slide every 3 seconds
        showSlides(); // Initial call

        // Collapsible Section
        const collapsible = document.querySelector('.collapsible');
        const content = document.querySelector('.content');

        collapsible.addEventListener('click', () => {
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        });
    </script>
</body>
</html>
